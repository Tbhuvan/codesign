name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          # Install without torch/transformer_lens to keep CI fast.
          # The 'slow' tests that need them are skipped via --deselect.
          pip install tree-sitter tree-sitter-python pytest pytest-cov ruff
          pip install -e . --no-deps

      - name: Lint with ruff
        run: ruff check src tests experiments

      - name: Test (fast)
        run: pytest -m "not slow" --cov=codesign --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install mypy tree-sitter tree-sitter-python
          pip install -e . --no-deps
      - run: mypy src/codesign --ignore-missing-imports
        continue-on-error: true
